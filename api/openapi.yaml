openapi: 3.1.0
info:
  contact:
    email: support@fakestoreapi.com
    url: https://fakestoreapi.com/docs
  description: A free fake API for testing and prototyping e-commerce applications.
  title: FakeStoreAPI
  version: v2.1.11
  x-logo:
    url: /icons/logo.png
    href: /
servers:
- url: https://fakestoreapi.com
tags:
- name: Products
  x-displayName: 🛒 Products
- name: Carts
  x-displayName: 🛍️ Carts
- name: Users
  x-displayName: 👤 Users
- name: Auth
  x-displayName: 🔒 Auth
paths:
  /products:
    get:
      description: Retrieve a list of all available products.
      operationId: getAllProducts
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Product"
                type: array
                default: null
          description: Success
        "400":
          description: Bad request
      summary: Get all products
      tags:
      - Products
      x-code-samples:
      - lang: javascript
        label: JavaScript (Browser)
        source: |-
          fetch('https://fakestoreapi.com/products')
            .then(response => response.json())
            .then(data => console.log(data));
      - lang: nodejs
        label: Node.js (Axios)
        source: |-
          const axios = require('axios');
          axios.get('https://fakestoreapi.com/products')
            .then(response => console.log(response.data));
      - lang: php
        label: PHP
        source: |-
          <?php
            $response = file_get_contents('https://fakestoreapi.com/products');
            echo $response;
          ?>
      - lang: curl
        label: cURL
        source: curl -X GET 'https://fakestoreapi.com/products'
      - lang: python
        label: Python
        source: |-
          import requests
          response = requests.get('https://fakestoreapi.com/products')
          print(response.json())
      x-accepts:
      - application/json
    post:
      description: Create a new product.
      operationId: addProduct
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Product"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
          description: Product created successfully
        "400":
          description: Bad request
      summary: Add a new product
      tags:
      - Products
      x-code-samples:
      - lang: javascript
        label: JavaScript (Browser)
        source: |-
          const product = { title: 'New Product', price: 29.99 };
          fetch('https://fakestoreapi.com/products', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(product)
          })
            .then(response => response.json())
            .then(data => console.log(data));
      - lang: nodejs
        label: Node.js (Axios)
        source: |-
          const axios = require('axios');
          const product = { title: 'New Product', price: 29.99 };
          axios.post('https://fakestoreapi.com/products', product)
            .then(response => console.log(response.data));
      - lang: php
        label: PHP
        source: |-
          <?php
            $product = json_encode(['title' => 'New Product', 'price' => 29.99]);
            $ch = curl_init('https://fakestoreapi.com/products');
            curl_setopt($ch, CURLOPT_POST, 1);
            curl_setopt($ch, CURLOPT_POSTFIELDS, $product);
            curl_setopt($ch, CURLOPT_HTTPHEADER, ['Content-Type: application/json']);
            $response = curl_exec($ch);
            curl_close($ch);
            echo $response;
          ?>
      - lang: curl
        label: cURL
        source: "curl -X POST 'https://fakestoreapi.com/products' -H 'Content-Type:\
          \ application/json' -d '{\"title\": \"New Product\", \"price\": 29.99}'"
      - lang: python
        label: Python
        source: |-
          import requests
          product = {'title': 'New Product', 'price': 29.99}
          response = requests.post('https://fakestoreapi.com/products', json=product)
          print(response.json())
      x-content-type: application/json
      x-accepts:
      - application/json
